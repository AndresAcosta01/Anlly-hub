<div class="min-h-dvh lg:pl-72">
  <!-- Barra superior móvil -->
  <header class="sticky top-0 z-30 flex items-center justify-between border-b border-borde bg-white/90 px-4 py-3 backdrop-blur lg:hidden">
    <span class="flex items-center gap-2 font-extrabold">
      <span class="degradado-hub grid size-8 place-items-center rounded-xl"><app-icono nombre="brillo" [tamano]="16" /></span>
      Anlly Hub
    </span>
    <button
      type="button"
      class="btn btn-secundario px-2.5"
      (click)="menuAbierto.set(true)"
      aria-label="Abrir menú"
      [attr.aria-expanded]="menuAbierto()"
      aria-controls="menu-lateral"
    >
      <app-icono nombre="menu" />
    </button>
  </header>

  @if (menuAbierto()) {
    <div class="fixed inset-0 z-40 bg-negro/40 lg:hidden" (click)="menuAbierto.set(false)"></div>
  }

  <!-- Barra lateral -->
  <aside
    id="menu-lateral"
    class="fixed inset-y-0 left-0 z-50 flex w-72 flex-col bg-negro p-5 text-white transition-transform duration-300 lg:translate-x-0"
    [class.-translate-x-full]="!menuAbierto()"
  >
    <div class="flex items-center justify-between">
      <a routerLink="/" class="flex items-center gap-3 rounded-xl" (click)="menuAbierto.set(false)">
        <span class="degradado-hub grid size-10 place-items-center rounded-2xl text-negro">
          <app-icono nombre="brillo" />
        </span>
        <span class="text-lg font-extrabold">Anlly Hub</span>
      </a>
      <button type="button" class="rounded-lg p-1 hover:bg-white/10 lg:hidden" (click)="menuAbierto.set(false)" aria-label="Cerrar menú">
        <app-icono nombre="cerrar" />
      </button>
    </div>

    <nav class="mt-10 flex flex-1 flex-col gap-1" aria-label="Principal">
      <p class="mb-2 px-3 text-xs font-bold tracking-widest text-white/50 uppercase">Herramientas</p>
      @for (enlace of enlaces(); track enlace.ruta) {
        <a
          [routerLink]="enlace.ruta"
          routerLinkActive="!bg-morado !text-negro"
          [routerLinkActiveOptions]="{ exact: enlace.ruta === '/' }"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-white/85 transition hover:bg-white/10 hover:text-white"
          (click)="menuAbierto.set(false)"
        >
          <app-icono [nombre]="enlace.icono" />
          {{ enlace.texto }}
        </a>
      }
    </nav>

    <div class="rounded-2xl bg-white/5 p-3">
      <div class="flex items-center gap-3">
        <span class="grid size-10 place-items-center rounded-full bg-rosado text-sm font-bold text-negro">{{ iniciales() }}</span>
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-semibold">{{ auth.perfil()?.nombre || auth.perfil()?.correo }}</p>
          <p class="text-xs text-white/70 capitalize">{{ auth.perfil()?.rol }}</p>
        </div>
        <button type="button" class="rounded-lg p-2 hover:bg-white/10" (click)="salir()" aria-label="Cerrar sesión" title="Cerrar sesión">
          <app-icono nombre="salir" [tamano]="18" />
        </button>
      </div>
    </div>
  </aside>

  <main class="mx-auto max-w-7xl px-4 py-6 sm:px-8 sm:py-10">
    <router-outlet />
  </main>
</div>

<app-avisos />
